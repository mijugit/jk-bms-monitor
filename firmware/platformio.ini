[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
board_build.mcu = esp32s3
board_build.psram = enabled
monitor_speed = 115200
upload_speed = 921600

; XIAO ESP32-S3 has no separate UART-USB bridge chip — without these flags,
; Serial.print() goes to the physically unconnected UART0 pins instead of the
; native USB port, so nothing ever reaches the host's serial monitor.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.1
    bblanchon/ArduinoJson @ ^7.0.4
